name: Release

on:
  push:
    tags:
      - "v*.*.*"
    # Feature branches build installers too, so a branch can be tested on all three platforms
    # without cutting a tag first. These never publish — see the --publish flag below.
    branches:
      - "feat/**"
      - "release/**"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to a GitHub release (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # electron-builder queues every asset upload behind one "create the release" call, so three
  # build jobs starting at once all see "release doesn't exist" and race to create it. The losers
  # get an empty-bodied response from GitHub, which JSON.parse throws on, and that one error fails
  # every upload they had queued. Creating the draft once, up front, leaves them nothing to race.
  prepare:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # This endpoint returns a 502 often enough to have broken the last two releases, so retry it.
      # The existence check runs before every attempt because a 502 can come back from a request
      # that actually succeeded — retrying blindly would then fail on a release that is already there.
      - name: Create the draft release if it is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag is present."
              exit 0
            fi
            if gh release create "$tag" --draft --title "$tag" --generate-notes; then
              exit 0
            fi
            echo "Attempt $attempt did not land; retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          echo "Could not create release $tag after 5 attempts."
          exit 1

  build:
    needs: prepare
    # prepare is skipped on PRs and branch builds, which must still build installers.
    if: always() && !cancelled() && needs.prepare.result != 'failure'

    # Each installer has to be produced on its own OS: electron-builder needs macOS tooling to
    # make a .dmg and Linux tooling for .deb/.rpm, so a single Windows runner cannot ship all
    # three. Running them in parallel keeps a full release at the speed of the slowest one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: windows-installers
          - os: macos-latest
            platform: mac
            artifact: macos-installers
          - os: ubuntu-latest
            platform: linux
            artifact: linux-installers

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # rpm packaging needs the rpm tool, which the Ubuntu runner does not ship with.
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Publishing is gated on an actual version tag (or an explicit manual request), not on
      # "was this a push" — otherwise every branch commit would create a GitHub release.
      #
      # GitHub's asset-upload endpoint answers some large uploads with a 500, and electron-builder
      # retries only 502/503/504 itself, so a publishing build gets three attempts. A rerun
      # overwrites whatever the earlier attempt already uploaded, so it is safe to repeat. A
      # build-only run fails deterministically and gets one attempt.
      - name: Build ${{ matrix.platform }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'always' || 'never' }}
          # Unsigned builds otherwise fail the notarization step on macOS runners.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          attempts=1
          if [[ "$PUBLISH" == always ]]; then attempts=3; fi
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            if npx electron-builder --${{ matrix.platform }} --publish "$PUBLISH"; then
              exit 0
            fi
            if (( attempt < attempts )); then
              echo "Attempt $attempt failed; retrying in $((attempt * 30))s."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      # Named per run so branch builds don't collide, and downloadable straight from the run
      # summary — that is how you get installers without publishing a release.
      - name: Upload ${{ matrix.platform }} installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap

  # The release starts as a draft so parallel upload jobs do not race each other. Publish it only
  # after every platform has uploaded its installer plus update metadata, otherwise existing users
  # can see a new version that their platform cannot actually install yet.
  publish:
    needs: [prepare, build]
    if: needs.prepare.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          echo "$assets"

          required=(
            "latest.yml"
            "latest-mac.yml"
            "latest-linux.yml"
          )
          missing=()
          for name in "${required[@]}"; do
            if ! grep -Fxq "$name" <<<"$assets"; then
              missing+=("$name")
            fi
          done
          if ! grep -Eq '\.exe$' <<<"$assets"; then missing+=("Windows .exe installer"); fi
          if ! grep -Eq '\.dmg$' <<<"$assets"; then missing+=("macOS .dmg installer"); fi
          if ! grep -Eq '\.zip$' <<<"$assets"; then missing+=("macOS .zip updater asset"); fi
          if ! grep -Eq '\.AppImage$' <<<"$assets"; then missing+=("Linux .AppImage updater asset"); fi
          if ((${#missing[@]})); then
            printf 'Release %s is missing updater assets:\n' "$tag"
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if gh release edit "$tag" --draft=false --latest; then
              exit 0
            fi
            echo "Attempt $attempt did not land; retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          echo "Built every installer but could not publish $tag — flip it by hand."
          exit 1
