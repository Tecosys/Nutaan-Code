<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<title>Recording</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .bar {
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px 7px 13px; border-radius: 999px;
    background: rgba(16, 18, 25, 0.97);
    border: 1px solid #262935;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }
  .live { width: 9px; height: 9px; border-radius: 50%; background: #f87171; animation: pulse 1.4s ease-in-out infinite; }
  .bar.paused .live { background: #e0a336; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
  .time { font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; color: #f1f2f5; min-width: 42px; }
  .sep { width: 1px; height: 14px; background: #262935; }
  button {
    -webkit-app-region: no-drag;
    font: inherit; font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
    background: #13151d; border: 1px solid #262935; color: #c7cad2; cursor: pointer;
  }
  button:hover { background: #191b24; color: #f1f2f5; }
  button.stop { background: rgba(248, 113, 113, 0.14); border-color: rgba(248, 113, 113, 0.38); color: #f87171; }
  button.stop:hover { background: rgba(248, 113, 113, 0.26); }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <span class="live"></span>
    <span class="time" id="time">0:00</span>
    <span class="sep"></span>
    <button id="mark" title="Mark a zoom here">Zoom</button>
    <button id="pause">Pause</button>
    <button class="stop" id="stop">Stop</button>
  </div>
  <script src="recbar.js"></script>
</body>
</html>
